<!doctype html>
<!--
  Personal site in one file: content is the YAML block in <body>,
  design is the <style> block, and the script at the end renders one
  into <div id="app">.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Loading…</title>
<meta name="description" content="" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap" rel="stylesheet">

<style>
  /* ─── tokens (light, dark) ──────────────────────────────────────── */
  :root{
    color-scheme: light dark;            /* follows the OS … */
    --sans:  "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Source Serif 4", "Iowan Old Style", Charter, Georgia, serif;

    --bg:           light-dark(#fbfbf9, #161514);
    --surface:      light-dark(#f1f1ec, #211f1d);
    --ink:          light-dark(#17181b, #ede9e2);
    --ink-2:        light-dark(#3f4246, #cbc5bb);
    --muted:        light-dark(#686b70, #9b958b);
    --rule:         light-dark(#e2e2dc, #2d2a27);
    --rule-strong:  light-dark(#c9c9c2, #423e39);
    --accent:       light-dark(#2b50aa, #9db4f5);
    --accent-soft:  light-dark(rgba(43, 80, 170, .08), rgba(157, 180, 245, .13));
    --pending:      light-dark(#8a5d00, #e6b65c);
    --pending-soft: light-dark(rgba(138, 93, 0, .09), rgba(230, 182, 92, .13));

    --side-w: 264px;
    --main-w: 700px;
    --gap:    72px;
    --date-w: 84px;                      /* date column of news / rows / service */
  }
  :root[data-theme="light"]{ color-scheme: light }   /* … unless the visitor picks one */
  :root[data-theme="dark"]{ color-scheme: dark }

  /* ─── base ───────────────────────────────────────────────────────── */
  *,*::before,*::after{ box-sizing:border-box }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:400 15.5px/1.6 var(--sans);
    font-feature-settings:"cv11","ss01";
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
  }
  ::selection{ background:var(--accent); color:var(--bg) }
  a{ color:inherit; text-decoration:none }
  a:hover{ color:var(--accent) }
  p{ margin:0 }
  strong{ font-weight:600; color:var(--ink) }
  sup{ font-size:.65em; line-height:0 }
  button{ font:inherit; color:inherit }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px }

  /* markdown links inside prose */
  .md a{ text-decoration:underline; text-decoration-color:var(--rule-strong); text-underline-offset:3px }
  .md a:hover{ text-decoration-color:var(--accent) }

  #app:not(.ready){ opacity:0 }
  #app.ready{ opacity:1; transition:opacity .2s }

  /* ─── layout ─────────────────────────────────────────────────────── */
  .shell{
    max-width:calc(var(--side-w) + var(--main-w) + var(--gap) + 64px);
    margin:0 auto;
    padding:64px 32px 80px;
    display:grid;
    grid-template-columns:var(--side-w) minmax(0, var(--main-w));
    column-gap:var(--gap);
  }

  /* ─── sidebar ────────────────────────────────────────────────────── */
  .side{
    position:sticky; top:64px; align-self:start;
    max-height:calc(100vh - 64px); overflow-y:auto; scrollbar-width:none;
    padding-bottom:24px;
  }
  .side::-webkit-scrollbar{ display:none }
  .name{
    font-family:var(--serif); font-weight:600;
    font-size:34px; line-height:1.1; letter-spacing:-.01em;
    margin:0;
  }
  .role{ color:var(--muted); font-size:14px; line-height:1.5; margin-top:10px }

  .contact{ list-style:none; margin:22px 0 0; padding:0; font-size:14px }
  .contact li{ padding:2px 0 }
  .contact a{ display:inline-flex; align-items:center; gap:9px; color:var(--ink-2) }
  .contact a:hover, .contact a:hover .ico{ color:var(--accent) }
  .contact .ico{ width:15px; height:15px; flex:0 0 auto; color:var(--muted); transition:color .15s }
  .contact .email{ overflow-wrap:anywhere }
  .contact .cta{
    display:inline-flex; gap:7px; margin-top:12px;
    padding:6px 14px; border:1px solid var(--ink); border-radius:999px;
    color:var(--ink); font-weight:500; font-size:13.5px;
  }
  .contact .cta .ico{ color:currentColor }
  .contact .cta:hover{ background:var(--ink); color:var(--bg) }

  .stats{
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
    margin:24px 0 0; padding:18px 0;
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  }
  .stat b{
    display:block; font-family:var(--serif); font-weight:600;
    font-size:26px; line-height:1; font-variant-numeric:lining-nums;
  }
  .stat span{ display:block; margin-top:4px; font-size:12px; color:var(--muted) }

  .toc{ margin-top:20px; display:flex; flex-direction:column }
  .toc a{
    padding:4px 0 4px 12px; border-left:2px solid var(--rule);
    color:var(--muted); font-size:13.5px;
  }
  .toc a:hover{ color:var(--ink) }
  .toc a[aria-current="true"]{ color:var(--ink); border-left-color:var(--accent) }

  /* ─── sections ───────────────────────────────────────────────────── */
  main.content{ min-width:0 }
  section{ padding-bottom:56px; scroll-margin-top:40px }
  .sec-title{
    display:flex; align-items:baseline; gap:10px;
    font-family:var(--serif); font-weight:600;
    font-size:23px; line-height:1.2; letter-spacing:-.005em;
    margin:0 0 18px;
  }

  /* about */
  .lede p{ font-size:17px; line-height:1.68; color:var(--ink-2) }
  .lede p + p{ margin-top:14px }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; padding:0; list-style:none }
  .chip{ font-size:13px; padding:4px 12px; border-radius:999px; background:var(--surface); color:var(--ink-2) }

  /* selected work */
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:16px }
  .card{
    display:flex; flex-direction:column; gap:10px;
    padding:20px; border:1px solid var(--rule); border-radius:12px;
    transition:border-color .15s;
  }
  .card:hover{ border-color:var(--rule-strong) }
  .kicker{ font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--accent) }
  .kicker.submitted{ color:var(--pending) }
  .card .title{ font-family:var(--serif); font-weight:600; font-size:19px; line-height:1.3 }
  .card .blurb{ font-size:14.5px; line-height:1.55; color:var(--ink-2) }
  .card .authors{ font-size:13.5px; color:var(--muted) }
  .card .links{ margin-top:auto; padding-top:2px }

  /* dated rows: news, generic rows, service */
  .list{ list-style:none; margin:0; padding:0 }
  .news li, .row, .svc{
    display:grid; grid-template-columns:var(--date-w) 1fr auto; gap:16px;
    padding:11px 0; border-top:1px solid var(--rule);
  }
  .svc{ grid-template-columns:var(--date-w) 1fr }
  .news li{ font-size:15px }
  .news li.extra{ display:none }
  .news.expanded li.extra{ display:grid }
  .date{ color:var(--muted); font-size:13.5px; font-variant-numeric:tabular-nums; padding-top:1px; white-space:nowrap }
  .where{ color:var(--muted); font-size:12.5px; white-space:nowrap; padding-top:2px; text-align:right }
  .more-btn{
    margin-top:8px; padding:6px 0; background:none; border:0; cursor:pointer;
    color:var(--accent); font-size:13.5px; font-weight:500;
  }

  /* publications */
  .toolbar{ display:flex; gap:6px; margin:0 0 18px }
  .seg{
    padding:5px 12px; border-radius:999px; cursor:pointer;
    border:1px solid var(--rule); background:transparent; color:var(--ink-2); font-size:13px;
  }
  .seg:hover{ border-color:var(--rule-strong) }
  .seg[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg) }
  .year-group{
    display:grid; grid-template-columns:64px 1fr; gap:0 16px;
    border-top:1px solid var(--rule); padding-top:16px;
  }
  .year{ margin:0; font-size:14px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums }
  .pub{ padding-bottom:20px }
  .pub-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px }
  .badge{
    font-size:11.5px; font-weight:600; letter-spacing:.02em;
    padding:1px 8px; border-radius:6px;
    background:var(--accent-soft); color:var(--accent);
  }
  .badge.submitted{ background:var(--pending-soft); color:var(--pending) }
  .badge.preprint{ background:var(--surface); color:var(--ink-2) }
  .pub-title{ font-weight:600; font-size:15.5px; line-height:1.42 }
  .pub-title a:hover{ color:var(--accent) }
  .pub-authors{ font-size:14px; line-height:1.5; color:var(--muted); margin-top:3px }
  .publist[data-filter="first"] .pub:not([data-first]){ display:none }

  .me{
    color:var(--ink); font-weight:600;
    text-decoration:underline; text-decoration-color:var(--accent);
    text-decoration-thickness:1.5px; text-underline-offset:3px;
  }
  .eq, .dag{ color:var(--accent) }

  .links{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px }
  .lnk{
    font-size:12.5px; font-weight:500; line-height:1.5;
    padding:2px 9px; border:1px solid var(--rule); border-radius:6px; color:var(--ink-2);
  }
  .lnk:hover{ border-color:var(--accent); color:var(--accent) }

  /* service */
  .svc .venues{ display:flex; flex-wrap:wrap; gap:6px }
  .svc .v{ font-size:13px; padding:1px 9px; border-radius:6px; background:var(--surface); color:var(--ink-2) }
  .note{ margin-top:12px; font-size:13px; color:var(--muted) }
  .note p + p{ margin-top:2px }

  /* generic rows */
  .row .tag{ display:block; margin-top:3px; font-size:12px; font-weight:600; color:var(--accent); white-space:nowrap }
  .row .what{ font-weight:600; font-size:15px }
  .row .det{ display:block; margin-top:2px; font-size:14px; color:var(--muted) }
  .gh-stars{ font-variant-numeric:tabular-nums }

  /* footer */
  .foot{
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 16px;
    padding-top:20px; border-top:1px solid var(--rule);
    font-size:13px; color:var(--muted);
  }
  .theme-btn{
    padding:3px 12px; border:1px solid var(--rule); border-radius:999px;
    background:none; color:var(--ink-2); font-size:12.5px; cursor:pointer;
  }
  .theme-btn:hover{ border-color:var(--rule-strong) }

  #render-error{
    max-width:640px; margin:64px auto; padding:20px 24px;
    border:1px solid #c0392b; border-radius:10px; font-family:var(--sans);
  }
  #render-error h3{ margin:0 0 8px; font-size:15px; color:#c0392b }
  #render-error code{ background:var(--surface); padding:1px 5px; border-radius:4px }

  /* ─── responsive ─────────────────────────────────────────────────── */
  @media (max-width: 960px){
    .shell{ grid-template-columns:minmax(0,1fr); padding:32px 20px 64px }
    .side{ position:static; max-height:none; overflow:visible; padding-bottom:8px; margin-bottom:40px }
    .name{ font-size:32px }
    .contact{ display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center }
    .contact li.cta-item{ width:100% }
    .stats{ grid-template-columns:repeat(4, 1fr) }
    .toc{ flex-direction:row; flex-wrap:wrap; gap:6px }   /* chips wrap; nothing is cut off */
    .toc a{ border:1px solid var(--rule); border-radius:999px; padding:4px 12px }
    .toc a[aria-current="true"]{ border-color:var(--rule) }
    .cards{ grid-template-columns:minmax(0,1fr) }
  }
  @media (max-width: 560px){
    .shell{ padding:24px 16px 56px }
    .stats{ grid-template-columns:1fr 1fr }
    .news li, .row, .svc{ grid-template-columns:minmax(0,1fr); gap:2px }
    .where{ text-align:left; white-space:normal }
    .year-group{ grid-template-columns:minmax(0,1fr); gap:8px }
    .lede p{ font-size:16px }
  }

  /* ─── print: the page doubles as a one-file CV ───────────────────── */
  @media print{
    body{ background:#fff; color:#000; font-size:10.5pt }
    .toc, .toolbar, .more-btn, .theme-btn{ display:none !important }
    .shell{ display:block; padding:0 }
    .side{ position:static; max-height:none; overflow:visible; margin-bottom:24px }
    .news li.extra{ display:grid }
    .card, .pub, .row{ break-inside:avoid }
  }
</style>
</head>

<body>

<!-- Content (YAML). Write "</script>" as "<\/script>" inside it. -->
<script id="site-data" type="text/yaml">
# Prose fields accept markdown. Tokens work in any text field:
#   {me:Name} your name · {eq} equal contribution * · {dag} †
#   {sup:th} superscript · ", ..." elided author list

# ─── PROFILE (sidebar) ──────────────────────────────────────────────
# `name` is also the browser-tab title; `description` is the search-
# engine summary; `updated` is shown in the footer.
# Link icons come from the URL; set `icon:` to override.
# {count:papers} / {count:first-author} are counted from publications.
profile:
  name:    "Jungwoo Park"
  role:    "Korea University · DMIS Lab · Ph.D. Candidate"
  description: >-
    Jungwoo Park — Ph.D. candidate at Korea University, working on
    language models, pre-training, and mechanistic interpretability.
  updated: "Oct 2026"
  email:   "jungwoo-park@korea.ac.kr"
  cv:      "https://github.com/affjljoo3581/affjljoo3581/blob/main/Jungwoo%20Park%20CV.pdf"
  links:
  - { label: "Google Scholar",   url: "https://scholar.google.com/citations?user=J8ShYjYAAAAJ" }
  - { label: "Semantic Scholar", url: "https://www.semanticscholar.org/author/Jungwoo-Park/2326546675" }
  - { label: "GitHub",           url: "https://github.com/affjljoo3581" }
  - { label: "Kaggle",           url: "https://www.kaggle.com/affjljoo3581" }
  - { label: "LinkedIn",         url: "https://www.linkedin.com/in/jungwoo-park-488713252/" }
  - { label: "X",                url: "https://x.com/affjljoo3581" }
  stats:
  - { value: "{count:papers}",       label: "Papers" }
  - { value: "{count:first-author}", label: "First-Author" }
  - { value: "2",                    label: "Solo Kaggle Golds" }
  - { value: "54{sup:th}",           label: "Kaggle Peak" }

# ─── SECTIONS (main column and nav, in this order) ──────────────────
# layout: about | selected | news | publications | service | rows (default)

sections:

# ─── ABOUT ──────────────────────────────────────────────────────────
- layout: about
  title:  "About"
  paragraphs:
  - >-
    I am a Ph.D. candidate in Computer Science & Engineering at Korea
    University, advised by **Prof. Jaewoo Kang** in the DMIS Lab. My
    research is on **large language models** — pre-training at scale,
    post-training stability, and mechanistic interpretability of the
    resulting models.
  - >-
    I’m drawn to problems where careful engineering meets understanding:
    building models that are cheaper to train and easier to take apart
    once they exist. Before my Ph.D. I spent four years competing on
    Kaggle, where I earned **two solo gold medals** alongside nine
    silvers.
  interests:
  - "Pre-Training"
  - "Mechanistic Interpretability"
  - "Quantization & Efficiency"

# ─── SELECTED WORK ──────────────────────────────────────────────────
# Shows the publications marked `featured: true`.
- layout: selected
  title:  "Selected Work"

# ─── NEWS ───────────────────────────────────────────────────────────
- layout: news
  title:  "News"
  items:
  - date:  "Oct 2026"
    body:  "Released **UltraBERT** and **UltraBERT-Embed** models on *Hugging Face*."
    where: "Hugging Face"
  - date:  "Aug 2026"
    body:  "**Meerkat2** accepted to *EMNLP 2026*."
    where: "Budapest, HU"
  - date:  "Jan 2026"
    body:  "**ASGuard** accepted to *ICLR 2026*."
    where: "Rio de Janeiro, BR"
  - date:  "Nov 2025"
    body:  "**Curious Case of Analogies** accepted to *AAAI 2026*."
    where: "Singapore"
  - date:  "Aug 2025"
    body:  "**Med-PRM** accepted to *EMNLP 2025*."
    where: "Suzhou, CN"
  - date:  "May 2025"
    body:  "**Outlier-Safe Pre-Training** accepted to *ACL 2025*."
    where: "Vienna, AT"
  - date:  "Jan 2025"
    body:  "**Monet** & **ChroKnowledge** both accepted to *ICLR 2025*."
    where: "Singapore"
  - date:  "Sep 2024"
    body:  "Started Ph.D. at Korea University DMIS Lab under **Prof. Jaewoo Kang**."
    where: "Seoul, KR"

# ─── PUBLICATIONS ───────────────────────────────────────────────────
# status: published (default) | preprint | submitted
# featured: true adds a card to Selected Work (with `featured_blurb`).
- layout: publications
  title:  "Publications"
  items:
  - year:     2026
    venue:    "Submitted to ICLR 2027"
    status:   submitted
    title:    "UltraBERT: Beyond the Limit of BERT Pre-Training"
    authors:  "{me:Jungwoo Park}, Taewhoo Lee, Jaewoo Kang"
    featured: true
    featured_blurb: >-
      Revisiting BERT-style encoder pre-training at scale and releasing
      150M and 380M English encoders with 32K context, built for both
      classification and retrieval.
    links:
      paper:       "https://arxiv.org/abs/2610.15028"
      huggingface: "https://huggingface.co/collections/dmis-lab/ultrabert"

    links:

  - year:    2026
    venue:   "Under Review"
    status:  submitted
    title:   "Self-Assessment Reinforcement Learning for Search-State Awareness in Retrieval-Augmented Large Language Models"
    authors: "Taewhoo Lee, Minju Song, {me:Jungwoo Park}, Chanwoong Yoon, Junha Jung, ..., Jaewoo Kang"

  - year:    2026

    title:   "ASGuard: Activation-Scaling Guard to Mitigate Targeted Jailbreaking Attack"

<!-- inline renderer — reads the <script id="site-data"> block above -->
<script>
/* ════════════════════════════════════════════════════════════════════
   renderer — reads the <script id="site-data"> YAML block and renders
   the page into <div id="app">.

   • left rail (sticky on desktop): `profile` — name, role, contact,
     stats — plus a nav built from the section titles
   • main column: `sections`, in order; each entry's `layout` picks
     the renderer below (default: rows)

   Libraries: js-yaml (YAML parsing), marked (inline markdown).
   ════════════════════════════════════════════════════════════════════ */

(function () {
  "use strict";

  const NEWS_VISIBLE = 5; // news items shown before "Show All"

  // ─── text helpers ─────────────────────────────────────────────────
  const esc = (s) =>
    String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  const isExternal = (href) => !/^(#|mailto:)/.test(href);
  const ext = (url, inner, cls) =>
    `<a${cls ? ` class="${cls}"` : ""} href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>`;

  // markdown links open in a new tab, except in-page and mailto links
  marked.use({
    renderer: {
      link(href, title, text) {
        const t = title ? ` title="${esc(title)}"` : "";
        const target = isExternal(href) ? ' target="_blank" rel="noopener"' : "";
        return `<a href="${esc(href)}"${t}${target}>${text}</a>`;
      },
    },
  });

  // content tokens (syntax is documented at the top of the YAML block)
  const tokens = (html) =>
    String(html ?? "")
      .replace(/\{me:([^}]+)\}/g, '<span class="me">$1</span>')
      .replace(/\{eq\}/g, '<span class="eq">*</span>')
      .replace(/\{dag\}/g, '<span class="dag">†</span>')
      .replace(/\{sup:([^}]+)\}/g, "<sup>$1</sup>")
      .replace(/,\s*\.\.\.\s*,?/g, ", &hellip;,");

  const fmt = (s) => tokens(marked.parseInline(String(s ?? "")));  // markdown + tokens
  const txt = (s) => tokens(esc(s));                                // plain text + tokens

  // ─── icons ────────────────────────────────────────────────────────
  // Brand marks: Simple Icons (CC0), except Kaggle from Font Awesome
  // (CC BY 4.0) because the Simple Icons mark is an unreadable wordmark.
  // UI glyphs: Lucide (ISC).
  const BRAND = {
    scholar: { d: "M5.242 13.769L0 9.5 12 0l12 9.5-5.242 4.269C17.548 11.249 14.978 9.5 12 9.5c-2.977 0-5.548 1.748-6.758 4.269zM12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14z" },
    semanticscholar: { d: "M24 8.609c-.848.536-1.436.83-2.146 1.245-4.152 2.509-8.15 5.295-11.247 8.981l-1.488 1.817-4.568-7.268c1.021.814 3.564 3.098 4.603 3.599l3.356-2.526c2.336-1.644 8.946-5.226 11.49-5.848ZM8.046 15.201c.346.277.692.537.969.744.761-3.668.121-7.613-1.886-11.039 3.374-.052 6.731-.087 10.105-.139a14.794 14.794 0 0 1 1.298 5.295c.294-.156.588-.294.883-.433-.104-1.868-.641-3.91-1.662-6.263-4.602-.018-9.188-.018-13.79-.018 2.993 3.547 4.36 7.839 4.083 11.853Zm-.623-.484c.087.086.191.155.277.225-.138-3.409-1.419-6.887-3.824-9.881H1.73c3.098 2.855 4.984 6.299 5.693 9.656Zm-.744-.658c.104.087.208.173.329.277-.9-2.526-2.492-5.018-4.741-7.198H0c2.89 2.076 5.122 4.481 6.679 6.921Z" },
    github: { d: "M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" },
    kaggle: { box: "0 0 320 512", d: "M304.2 501.5L158.4 320.3 298.2 185c2.6-2.7 1.7-10.5-5.3-10.5l-69.2 0c-3.5 0-7 1.8-10.5 5.3l-132.3 133.7 0-306c0-5-2.5-7.5-7.5-7.5L21.5 0C16.5 0 14 2.5 14 7.5l0 497c0 5 2.5 7.5 7.5 7.5l51.9 0c5 0 7.5-2.5 7.5-7.5l0-109 30.8-29.3 110.5 140.6c3 3.5 6.5 5.3 10.5 5.3l66.9 0c3.5 0 5.5-1 6-3l-1.4-7.6z" },
    linkedin: { d: "M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" },
    x: { d: "M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z" },
  };
  const GLYPH = {
    mail: '<path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
    cv: '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  };
  // link host → brand icon (subdomains match too)
  const HOST_ICON = {
    "scholar.google.com": "scholar",
    "semanticscholar.org": "semanticscholar",
    "github.com": "github",
    "kaggle.com": "kaggle",
    "linkedin.com": "linkedin",
    "x.com": "x",
    "twitter.com": "x",
  };

  function icon(name) {
    const b = BRAND[name];
    if (b) {
      return `<svg class="ico" viewBox="${b.box || "0 0 24 24"}" fill="currentColor" aria-hidden="true"><path d="${b.d}"/></svg>`;
    }
    return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH[name] || GLYPH.link}</svg>`;
  }

  function iconForUrl(url) {
    let host = "";
    try {
      host = new URL(url).hostname;
    } catch (_) {}
    const key = Object.keys(HOST_ICON).find((h) => host === h || host.endsWith(`.${h}`));
    return key ? HOST_ICON[key] : "link";
  }

  // ─── publications ─────────────────────────────────────────────────
  // items of the publications section (also used by Selected Work and stats)
  const publicationsOf = (d) => ((d.sections || []).find((s) => s.layout === "publications") || {}).items || [];

  // first author = listed first, or marked equal-contribution
  const isFirstAuthor = ({ authors = "" }) => /^\s*\{me:/.test(authors) || /\{me:[^}]+\}\{eq\}/.test(authors);
  const statusOf = (p) => p.status || "published"; // published | preprint | submitted

  // known link keys first (in this order), any other key after, as written
  const LINK_ORDER = ["paper", "code", "slides", "bib"];
  const LINK_LABEL = { bib: "BibTeX", huggingface: "Hugging Face" };
  const linkLabel = (k) => LINK_LABEL[k] || k.charAt(0).toUpperCase() + k.slice(1);
  const rank = (k) => (LINK_ORDER.includes(k) ? LINK_ORDER.indexOf(k) : LINK_ORDER.length);

  function linksHTML(links) {
    const keys = Object.keys(links || {})
      .filter((k) => links[k])
      .sort((a, b) => rank(a) - rank(b));
    return keys.length
      ? `<div class="links">${keys.map((k) => ext(links[k], esc(linkLabel(k)), "lnk")).join("")}</div>`
      : "";
  }
  // the title links to the paper when there is one
  const titleHTML = (p) => (p.links && p.links.paper ? ext(p.links.paper, esc(p.title)) : esc(p.title));

  // ─── sidebar ──────────────────────────────────────────────────────
  // {count:papers} / {count:first-author} are computed from publications
  const COUNTERS = {
    papers: (d) => publicationsOf(d).length,
    "first-author": (d) => publicationsOf(d).filter(isFirstAuthor).length,
  };
  const withCounts = (v, d) =>
    String(v ?? "").replace(/\{count:([\w-]+)\}/g, (m, k) => (COUNTERS[k] ? String(COUNTERS[k](d)) : m));

  function sidebarHTML(d, nav) {
    const p = d.profile || {};

    const contact = [
      p.email && `<li><a href="mailto:${esc(p.email)}">${icon("mail")}<span class="email">${esc(p.email)}</span></a></li>`,
      ...(p.links || []).map(
        (l) => `<li>${ext(l.url, `${icon(l.icon || iconForUrl(l.url))}<span>${esc(l.label)}</span>`)}</li>`,
      ),
      p.cv && `<li class="cta-item">${ext(p.cv, `${icon("cv")}<span>CV</span>`, "cta")}</li>`,
    ]
      .filter(Boolean)
      .join("");

    const stats = (p.stats || [])
      .map((s) => `<div class="stat"><b>${txt(withCounts(s.value, d))}</b><span>${esc(s.label)}</span></div>`)
      .join("");

    return `
      <aside class="side">
        <h1 class="name">${esc(p.name)}</h1>
        ${p.role ? `<p class="role">${esc(p.role)}</p>` : ""}
        <ul class="contact" aria-label="contact">${contact}</ul>
        ${stats ? `<div class="stats" aria-label="at a glance">${stats}</div>` : ""}
        <nav class="toc" aria-label="sections">${nav.map((s) => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join("")}</nav>
      </aside>`;
  }

  // ─── layouts: section entry → body HTML ("" skips the section) ────
  function aboutHTML(s) {
    const paras = (s.paragraphs || []).map((p) => `<p>${fmt(p)}</p>`).join("");
    const chips = (s.interests || []).map((i) => `<li class="chip">${esc(i)}</li>`).join("");
    if (!paras && !chips) return "";
    return `<div class="lede md">${paras}</div>${chips ? `<ul class="chips" aria-label="research interests">${chips}</ul>` : ""}`;
  }

  function selectedHTML(s, d) {
    const cards = publicationsOf(d)
      .filter((p) => p.featured)
      .map((p) => {
        const pending = statusOf(p) === "submitted";
        // submitted venues already read as a full line ("Submitted to ICLR 2027")
        const kicker = p.featured_kicker || (pending ? p.venue : `${p.venue} ${p.year}`);
        return `
          <article class="card">
            <p class="kicker${pending ? " submitted" : ""}">${esc(kicker)}</p>
            <p class="title">${titleHTML(p)}</p>
            ${p.featured_blurb ? `<p class="blurb md">${fmt(p.featured_blurb)}</p>` : ""}
            <p class="authors">${txt(p.authors)}</p>
            ${linksHTML(p.links)}
          </article>`;
      })
      .join("");
    return cards && `<div class="cards">${cards}</div>`;
  }

  function newsHTML({ items: news = [] }) {
    if (!news.length) return "";
    const rows = news
      .map(
        (n, i) => `
        <li${i >= NEWS_VISIBLE ? ' class="extra"' : ""}>
          <span class="date">${esc(n.date)}</span>
          <span class="md">${fmt(n.body)}</span>
          <span class="where">${esc(n.where)}</span>
        </li>`,
      )
      .join("");
    const more =
      news.length > NEWS_VISIBLE
        ? `<button class="more-btn" type="button" data-total="${news.length}" aria-expanded="false">Show All ${news.length}</button>`
        : "";
    return `<ul class="list news">${rows}</ul>${more}`;
  }

  function publicationsHTML({ items: pubs = [] }) {
    if (!pubs.length) return "";
    // grouped by year, newest first; YAML order is kept within a year
    const years = [...new Set(pubs.map((p) => p.year))].sort((a, b) => b - a);
    const groups = years
      .map((y) => {
        const items = pubs
          .filter((p) => p.year === y)
          .map(
            (p) => `
              <li class="pub"${isFirstAuthor(p) ? " data-first" : ""}>
                <div class="pub-meta"><span class="badge ${statusOf(p)}">${esc(p.venue)}</span></div>
                <p class="pub-title">${titleHTML(p)}</p>
                <p class="pub-authors">${txt(p.authors)}</p>
                ${linksHTML(p.links)}
              </li>`,
          )
          .join("");
        return `<div class="year-group"><h3 class="year">${esc(y)}</h3><ol class="list">${items}</ol></div>`;
      })
      .join("");

    const toolbar = `
      <div class="toolbar" role="group" aria-label="filter publications">
        <button class="seg" type="button" data-filter="all" aria-pressed="true">All ${pubs.length}</button>
        <button class="seg" type="button" data-filter="first" aria-pressed="false">First Author ${pubs.filter(isFirstAuthor).length}</button>
      </div>`;
    const eqNote = pubs.some((p) => /\{eq\}/.test(p.authors || ""))
      ? `<p class="note"><span class="eq">*</span> Equal contribution.</p>`
      : "";
    return `${toolbar}<div class="publist" data-filter="all">${groups}</div>${eqNote}`;
  }

  function serviceHTML({ items: service = [], note }) {
    if (!service.length) return "";
    const rows = service
      .map(
        (s) => `
        <div class="svc">
          <span class="date">${esc(s.year)}</span>
          <div class="venues">${(s.venues || []).map((v) => `<span class="v">${txt(v)}</span>`).join("")}</div>
        </div>`,
      )
      .join("");
    const notes = [].concat(note || []);
    return rows + (notes.length ? `<div class="note md">${notes.map((p) => `<p>${fmt(p)}</p>`).join("")}</div>` : "");
  }

  // generic rows: { date, tag?, body, det?, where? | repo? }
  function rowsHTML({ items = [] }) {
    if (!items.length) return "";
    const rows = items
      .map((it) => {
        const right = it.repo
          ? `<span class="gh-stars" data-repo="${esc(it.repo)}" title="GitHub stars for ${esc(it.repo)}"></span>`
          : txt(it.where);
        return `
          <li class="row">
            <span class="date">${esc(it.date)}${it.tag ? `<span class="tag">${txt(it.tag)}</span>` : ""}</span>
            <span class="md"><span class="what">${fmt(it.body)}</span>${it.det ? `<span class="det">${fmt(it.det)}</span>` : ""}</span>
            <span class="where">${right}</span>
          </li>`;
      })
      .join("");
    return `<ul class="list">${rows}</ul>`;
  }

  // layout name → (section entry, whole data) → body HTML
  const LAYOUTS = {
    about: aboutHTML,
    selected: selectedHTML,
    news: newsHTML,
    publications: publicationsHTML,
    service: serviceHTML,
    rows: rowsHTML,
  };

  // "Academic Service" → "academic-service"
  const slug = (t) => String(t ?? "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function renderAll(d) {
    const sections = (d.sections || [])
      .map((s) => ({
        id: s.id || slug(s.title),
        title: s.title,
        body: (LAYOUTS[s.layout || "rows"] || LAYOUTS.rows)(s, d),
      }))
      .filter((s) => s.body);

    const main = sections
      .map((s) => `<section id="${esc(s.id)}"><h2 class="sec-title">${esc(s.title)}</h2>${s.body}</section>`)
      .join("");
    const p = d.profile || {};
    const rev = p.updated ? ` · Last Revised ${esc(p.updated)}` : "";

    return `
      <div class="shell">
        ${sidebarHTML(d, sections)}
        <main class="content">
          ${main}
          <footer class="foot">
            <span>© ${new Date().getFullYear()} ${esc(p.name)}${rev}</span>
            <button class="theme-btn" type="button" id="theme-toggle"></button>
          </footer>
        </main>
      </div>`;
  }

  // ─── interactions ─────────────────────────────────────────────────
  function bindPublicationFilter() {
    const list = document.querySelector(".publist");
    if (!list) return;
    const buttons = document.querySelectorAll(".seg[data-filter]");
    buttons.forEach((btn) =>
      btn.addEventListener("click", () => {
        const f = btn.dataset.filter;
        list.dataset.filter = f;
        buttons.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        // hide year groups that end up empty
        list.querySelectorAll(".year-group").forEach((g) => {
          g.hidden = f === "first" && !g.querySelector(".pub[data-first]");
        });
      }),
    );
  }

  function bindNewsToggle() {
    const btn = document.querySelector(".more-btn");
    const list = document.querySelector(".news");
    if (!btn || !list) return;
    btn.addEventListener("click", () => {
      const open = list.classList.toggle("expanded");
      btn.setAttribute("aria-expanded", String(open));
      btn.textContent = open ? "Show Less" : `Show All ${btn.dataset.total}`;
    });
  }

  // highlight the nav entry of the section currently in view
  function bindScrollSpy() {
    const links = [...document.querySelectorAll(".toc a")];
    if (!links.length || !("IntersectionObserver" in window)) return;
    const visible = new Set();
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => (e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id)));
        const current = links.find((a) => visible.has(a.hash.slice(1)));
        links.forEach((a) => a.setAttribute("aria-current", String(a === current)));
      },
      { rootMargin: "-20% 0px -60% 0px" },
    );
    links.forEach((a) => {
      const el = document.getElementById(a.hash.slice(1));
      if (el) io.observe(el);
    });
  }

  // ─── theme (follows the OS until the visitor picks one) ───────────
  const root = document.documentElement;
  const THEME_KEY = "theme-v2";
  const isDark = () =>
    root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;

  function bindThemeToggle() {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") root.dataset.theme = saved;
    } catch (_) {}
    const btn = document.getElementById("theme-toggle");
    if (!btn) return;
    const label = () => (btn.textContent = isDark() ? "Light Mode" : "Dark Mode");
    label();
    btn.addEventListener("click", () => {
      root.dataset.theme = isDark() ? "light" : "dark";
      try {
        localStorage.setItem(THEME_KEY, root.dataset.theme);
      } catch (_) {}
      label();
    });
  }

  // ─── GitHub stars (async, cached 24h per repo) ────────────────────
  async function fetchStars(repo) {
    const key = `gh-stars:${repo}`;
    try {
      const { stars, ts } = JSON.parse(localStorage.getItem(key) || "{}");
      if (typeof stars === "number" && Date.now() - ts < 864e5) return stars;
    } catch (_) {}
    const res = await fetch(`https://api.github.com/repos/${repo}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const stars = (await res.json()).stargazers_count;
    try {
      localStorage.setItem(key, JSON.stringify({ stars, ts: Date.now() }));
    } catch (_) {}
    return stars;
  }

  function hydrateGitHubStars() {
    const els = [...document.querySelectorAll(".gh-stars[data-repo]")];
    const repos = [...new Set(els.map((el) => el.dataset.repo))];
    repos.forEach((repo) =>
      fetchStars(repo)
        .then((n) => `★ ${n.toLocaleString()}`)
        .catch(() => "") // on failure, leave the slot empty
        .then((text) => els.filter((el) => el.dataset.repo === repo).forEach((el) => (el.textContent = text))),
    );
  }

  // ─── entry point ──────────────────────────────────────────────────
  function showError(title, detail) {
    const app = document.getElementById("app");
    app.classList.add("ready");
    app.innerHTML = `<div id="render-error" role="alert"><h3>${esc(title)}</h3><div>${detail}</div></div>`;
  }

  function main() {
    const dataTag = document.getElementById("site-data");
    if (!dataTag) {
      showError("Missing data block", `<p>Could not find <code>&lt;script id="site-data"&gt;</code> in this page.</p>`);
      return;
    }

    let data;
    try {
      data = jsyaml.load(dataTag.textContent);
    } catch (err) {
      showError("The YAML data block has a syntax error", `<p><code>${esc(err.message || String(err))}</code></p>`);
      return;
    }

    const profile = data.profile || {};
    document.title = profile.name || "";
    if (profile.description) document.querySelector('meta[name="description"]').setAttribute("content", profile.description);

    const app = document.getElementById("app");
    app.innerHTML = renderAll(data);
    app.classList.add("ready");

    bindThemeToggle();
    bindPublicationFilter();
    bindNewsToggle();
    bindScrollSpy();
    hydrateGitHubStars();
  }

  document.addEventListener("DOMContentLoaded", main);
})();

</script>

</body>
</html>
